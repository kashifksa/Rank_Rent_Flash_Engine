<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Builder</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">&#9889;</span><b>Site Builder</b><span id="projName"></span></div>
    <label class="tb">Template
      <select id="tplSel"></select>
    </label>
    <label class="tb">Page
      <select id="pageSel"></select>
    </label>
    <div class="grow"></div>
    <div class="seg" id="vpSeg">
      <button data-vp="desktop" class="on" title="Desktop">Desktop</button>
      <button data-vp="tablet" title="Tablet">Tablet</button>
      <button data-vp="mobile" title="Mobile">Mobile</button>
    </div>
    <button class="btn2" id="themeBtn">Theme</button>
    <div class="menu">
      <button class="btn2 primary" id="exportBtn">Export &#9662;</button>
      <div class="menu-list" id="exportMenu">
        <button data-act="page">Download this page (.html)</button>
        <button data-act="all">Download all pages</button>
        <hr>
        <button data-act="save">Save project file (.json)</button>
        <button data-act="load">Load project file</button>
        <hr>
        <button data-act="reset" class="danger">Reset all my edits</button>
      </div>
    </div>
    <input type="file" id="fileIn" accept=".json" hidden>
  </header>

  <aside id="left">
    <div class="ph"><span>Sections</span><small id="secCount"></small></div>
    <div id="seclist"></div>
    <div id="addbox"></div>
  </aside>

  <main id="stage">
    <div id="frameWrap"><iframe id="frame" title="Page preview"></iframe></div>
  </main>

  <aside id="right"><div id="editor"></div></aside>

  <div id="themePop" class="pop" hidden>
    <h4>Theme <small id="tplNote"></small></h4>
    <label>Primary / dark color <input type="color" id="thPrimary"></label>
    <label>Accent color <input type="color" id="thAccent"></label>
    <label>Fonts <select id="thFont"></select></label>
    <label>Corner radius <input type="range" id="thRadius" min="0" max="24" step="2"></label>
    <label>Section spacing <select id="thDensity"><option value="compact">Compact</option><option value="balanced">Balanced</option><option value="spacious">Spacious</option></select></label>
    <label>Default animation <select id="thAnim"><option value="">Template default</option><option value="none">None</option><option value="fade">Fade in</option><option value="rise">Rise up</option><option value="slide-left">Slide from left</option><option value="slide-right">Slide from right</option><option value="zoom">Zoom in</option><option value="stagger">Cards one by one</option></select></label>
    <label>Default hero effect <select id="thFx"><option value="">Template default</option><option value="none">None</option><option value="airflow">Airflow</option><option value="motes">Motes</option><option value="blueprint">Blueprint grid</option></select></label>
    <button class="btn2" id="thReset">Reset to template colors</button>
    <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:2px 0">
    <h4>Brand</h4>
    <label>Logo <select id="thLogoSrc"><option value="auto">Auto-detect from images/</option><option value="upload">Uploaded file</option><option value="none">No logo (text only)</option></select></label>
    <button class="btn2" id="thLogoBtn">Upload logo (.webp / .png)</button><input type="file" id="thLogoFile" accept="image/webp,image/png,image/jpeg,image/svg+xml" hidden>
    <label>Logo height <input type="range" id="thLogoH" min="24" max="96" step="2"></label>
    <label>Header shows <select id="thLogoMode"><option value="auto">Auto</option><option value="logo">Logo only</option><option value="both">Logo + company name</option><option value="text">Company name only</option></select></label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="thFavicon"> Use favicon</label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="thFooterLogo"> Logo in footer</label>
    <small id="logoNote" style="color:var(--muted);line-height:1.4"></small>
  </div>
  <div id="toast"></div>
</div>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/site-css.js"></script>
<script src="js/templates.js"></script>
<script src="js/blocks.js"></script>
<script src="js/site.js"></script>
<script src="js/app.js"></script>
</body>
</html>
